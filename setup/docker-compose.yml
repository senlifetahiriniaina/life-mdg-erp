services:

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
    networks:
      - widehalo-erp
    environment:
      - API_URL=http://api:8000
    depends_on:
      - redis

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ..:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - widehalo-erp
    depends_on:
      - app

  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../webapp:/app
    command: sh -c "npm ci --legacy-peer-deps && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - widehalo-erp

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks:
      - widehalo-erp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  widehalo-erp:
    driver: bridge
