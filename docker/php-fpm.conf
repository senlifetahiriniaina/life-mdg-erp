; PHP-FPM pool — replaces the default "www" pool
; Copied into the image at /usr/local/etc/php-fpm.d/php-fpm.conf (see Dockerfile)
;
; The container already runs as non-root (Dockerfile sets USER appuser
; before CMD), so no user/group override is set here — that would require
; the FPM master to start as root in order to drop privileges per-pool.

[www]
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Status/ping endpoints, polled by the health check and by monitoring
pm.status_path = /fpm-status
ping.path = /fpm-ping

catch_workers_output = yes
clear_env = no
