; Copied into /etc/supervisor/conf.d/ (see Dockerfile) — a fragment only.
; The base image's own /etc/supervisor/supervisord.conf (installed by the
; `supervisor` apt package) already defines [supervisord]/[unix_http_server]/
; [supervisorctl] and includes conf.d/*.conf, so this file must contain only
; [program:...]/[group:...] blocks, never those top-level sections again.

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
