# Stack de production — app + file d'attente + planificateur + MySQL + Redis +
# Caddy (reverse-proxy avec certificat SSL Let's Encrypt automatique).
#
# Fichier autonome, prêt à l'emploi avec `scripts/deploy.sh` (voir
# docs/07-DEPLOIEMENT/GUIDE-DEPLOIEMENT-SIMPLE.md pour le guide complet). Ce
# fichier construit l'image depuis le `Dockerfile` racine, déjà validée par
# `docker-build.yml` en CI — voir CLAUDE.md "Known gaps".
#
# MySQL et Redis ne publient volontairement AUCUN port sur l'hôte (contrairement
# à docker-compose.redis.yml, prévu pour un usage dev/CI isolé) : dans cette
# stack de production, seuls les conteneurs du même réseau Docker y accèdent
# (via les noms de service `mysql`/`redis`), donc rien ne doit être exposé sur
# Internet. Caddy est le seul service qui publie des ports (80/443).
#
# Le service `app-publish` copie `public/` (déjà buildé dans l'image au moment
# du `docker build`, cf. Dockerfile) vers un volume nommé partagé, en root,
# avant que `app`/`caddy` ne démarrent — Caddy sert ces fichiers statiques
# directement et ne relaie vers php-fpm que les requêtes PHP (voir Caddyfile).
# Ce détour est nécessaire parce que l'image ne déclare pas `public/` comme
# volume : sans lui, Caddy n'aurait aucun moyen de lire les fichiers construits
# dans l'image de l'application.
#
# `reverb` fait tourner le serveur WebSocket (voir CLAUDE.md § Chantier 20 —
# NotificationBell + Messaging temps réel). Caddy relaie /app/* (chemin
# protocole Pusher qu'utilise le client Reverb) vers ce conteneur — voir
# Caddyfile — pour que le navigateur atteigne Reverb en wss:// sur le même
# domaine/certificat que le reste de l'app, sans port supplémentaire à ouvrir.
#
# `meilisearch` fait tourner le moteur de recherche indexé par Laravel Scout
# (voir CLAUDE.md § Chantier 34 — Modules\CRM\Models\Contact utilise le trait
# Searchable) — sans ce service, la création/modification/suppression d'un
# contact CRM échoue en production (Scout indexe de façon synchrone par
# défaut, sauf SCOUT_QUEUE=true ci-dessous). Aucun port publié sur l'hôte,
# même précédent que mysql/redis — accessible uniquement via le réseau Docker
# interne, sous le nom de service `meilisearch`.
#
# `x-build` factorise le build (mêmes ARGs partout) : les 4 VITE_REVERB_*
# doivent être identiques sur tous les services qui partagent le même tag
# `image:`, sans quoi le dernier service construit écraserait silencieusement
# les assets frontend buildés par un autre avec des variables différentes.
# Sourcées depuis .env (docker compose lit automatiquement le .env du même
# répertoire que ce fichier pour l'interpolation ${...}, en plus de la
# lecture via `env_file:` pour l'environnement runtime des conteneurs).
x-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
    args:
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-app-key}
      VITE_REVERB_HOST: ${APP_DOMAIN:-localhost}
      VITE_REVERB_PORT: "443"
      VITE_REVERB_SCHEME: https
  image: life-mdg-erp:${IMAGE_TAG:-latest}

# Plafond de taille de logs appliqué à chaque service (résilience — voir
# CLAUDE.md "Résilience du déploiement") : sans lui, une VM qui tourne
# longtemps sans supervision (le scénario même que ce chantier adresse) peut
# voir ses logs Docker remplir tout le disque, un mode de panne silencieux
# indépendant de tout crash applicatif.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app-publish:
    <<: [*app-build, *default-logging]
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /shared/public && cp -r /app/public/. /shared/public/"]
    volumes:
      - app_public:/shared/public
    networks:
      - life-mdg-erp

  app:
    <<: [*app-build, *default-logging]
    restart: unless-stopped
    depends_on:
      app-publish:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MEILISEARCH_HOST: http://meilisearch:7700
    volumes:
      - storage_data:/app/storage/app
    healthcheck:
      test: ["CMD", "php", "/app/docker/health-check.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - life-mdg-erp

  queue:
    <<: [*app-build, *default-logging]
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    depends_on:
      app-publish:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MEILISEARCH_HOST: http://meilisearch:7700
    volumes:
      - storage_data:/app/storage/app
    # `queue:work` a un mode "process en boucle", pas de port à sonder — on
    # vérifie donc que le process lui-même est bien vivant dans le conteneur.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - life-mdg-erp

  scheduler:
    <<: [*app-build, *default-logging]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on:
      app-publish:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MEILISEARCH_HOST: http://meilisearch:7700
    volumes:
      - storage_data:/app/storage/app
    # Même logique que "queue" — la boucle `while true` est le process à
    # surveiller (son PID reste stable ; php lui-même est relancé toutes les
    # 60s comme sous-process, ce qui est le comportement normal).
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'while true; do php artisan schedule:run' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - life-mdg-erp

  reverb:
    <<: [*app-build, *default-logging]
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      app-publish:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REVERB_HOST: 0.0.0.0
    # Même patron TCP-connect que docker/health-check.php (php-fpm), pointé
    # sur le port WebSocket de Reverb — voir docker/reverb-health-check.php.
    healthcheck:
      test: ["CMD", "php", "/app/docker/reverb-health-check.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - life-mdg-erp

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    <<: *default-logging
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-life_mdg_erp}
      MYSQL_USER: ${DB_USERNAME:-life_mdg}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - life-mdg-erp

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    <<: *default-logging
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - life-mdg-erp

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - life-mdg-erp

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *default-logging
    depends_on:
      app-publish:
        condition: service_completed_successfully
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - app_public:/srv/public:ro
      - caddy_data:/data
      - caddy_config:/config
    # `wget` est présent dans l'image caddy:2-alpine (busybox) — vérifie que
    # Caddy répond localement, indépendamment de la validité du certificat
    # SSL/DNS externe (qui peut être en cours d'obtention au démarrage).
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - life-mdg-erp

volumes:
  app_public:
  storage_data:
  mysql_data:
  redis_data:
  meilisearch_data:
  caddy_data:
  caddy_config:

networks:
  life-mdg-erp:
    driver: bridge
