    get:
      summary: 'Meta webhook verification challenge.'
      operationId: metaWebhookVerificationChallenge
      description: "Called by Meta during webhook registration. Responds with the hub_challenge\nwhen hub_verify_token matches the configured value."
      parameters:
        -
          in: query
          name: hub_mode
          description: 'Must be "subscribe".'
          example: subscribe
          required: true
          schema:
            type: string
            description: 'Must be "subscribe".'
            example: subscribe
        -
          in: query
          name: hub_verify_token
          description: 'Your configured verify token.'
          example: widehalo_webhook_token
          required: true
          schema:
            type: string
            description: 'Your configured verify token.'
            example: widehalo_webhook_token
        -
          in: query
          name: hub_challenge
          description: 'Challenge string to echo back.'
          example: '123456789'
          required: true
          schema:
            type: string
            description: 'Challenge string to echo back.'
            example: '123456789'
      responses:
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: Forbidden
                properties:
                  error:
                    type: string
                    example: Forbidden
      tags:
        - 'WhatsApp - Webhook'
      security: []
    post:
      summary: 'Receive inbound WhatsApp messages from Meta.'
      operationId: receiveInboundWhatsAppMessagesFromMeta
      description: "Must include a valid X-Hub-Signature-256 header (HMAC-SHA256 of the raw body\nsigned with WHATSAPP_APP_SECRET). Messages are persisted and queued for AI handling."
      parameters:
        -
          in: header
          name: X-Hub-Signature-256
          description: ''
          example: 'sha256=<hmac_of_body> required'
          schema:
            type: string
      responses: {  }
      tags:
        - 'WhatsApp - Webhook'
      security: []
