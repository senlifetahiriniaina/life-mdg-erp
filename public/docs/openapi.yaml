  -
    name: 'BI - Dashboard'
    description: "\nRetrieve and manage BI dashboards."
  -
    name: 'BI - Kpi'
    description: "\nManage KPI definitions and retrieve current values."
  -
    name: 'BI - Report'
    description: "\nGenerate and schedule BI reports."
  -
    name: 'CRM - Account'
    description: "\nManage CRM accounts (companies)."
  -
    name: 'CRM - Activity'
    description: "\nLog and track CRM activities (calls, meetings, emails)."
  -
    name: 'CRM - Contacts'
    description: "\nManage CRM contacts: people associated with accounts, leads and opportunities."
  -
    name: 'CRM - CrmAI'
    description: "\nAI-powered CRM suggestions and lead scoring."
  -
    name: 'CRM - Lead'
    description: "\nManage sales leads through the qualification pipeline."
  -
    name: 'CRM - Opportunity'
    description: "\nManage sales opportunities and deal stages."
  -
    name: 'CRM - Pipeline'
    description: "\nConfigure CRM pipelines and stages."
  -
    name: 'Core - AIAssistant'
    description: "\nInteract with the WideHalo AI assistant."
  -
    name: 'Core - Auth'
    description: "\nRegister, login, logout and manage authentication tokens."
  -
    name: 'Core - Module'
    description: "\nEnable and disable ERP modules per tenant."
  -
    name: 'Core - Sync'
    description: "\nOffline-first data synchronisation (push/pull mutations)."
  -
    name: 'Documents - Document'
    description: "\nUpload, download and manage documents in the DMS."
  -
    name: 'Documents - Folder'
    description: "\nManage document folders and access permissions."
  -
    name: 'Ecommerce - Order'
    description: "\nManage e-commerce orders."
  -
    name: 'Ecommerce - Product'
    description: "\nManage product resources."
  -
    name: 'Ecommerce - Store'
    description: "\nManage e-commerce store configuration."
  -
    name: 'Email - AI'
    description: "\nAI-powered email content generation."
  -
    name: 'Email - Campaign'
    description: "\nCreate and send email marketing campaigns."
  -
    name: 'Email - Subscriber'
    description: "\nManage email subscriber lists."
  -
    name: 'Email - Template'
    description: "\nManage reusable email templates."
  -
    name: Endpoints
    description: ''
  -
    name: 'HR - Department'
    description: "\nManage HR departments."
  -
    name: 'HR - Employee'
    description: "\nManage employee records and employment lifecycle."
  -
    name: 'HR - HrAI'
    description: "\nAI-powered HR analytics and recommendations."
  -
    name: 'HR - JobPosition'
    description: "\nManage job positions and org chart."
  -
    name: 'HR - Leave'
    description: "\nSubmit, approve and reject leave requests."
  -
    name: 'HR - LeaveType'
    description: "\nConfigure leave types (annual, sick, parental, etc.)."
  -
    name: 'Helpdesk - AI'
    description: "\nAI-powered ticket classification and suggested replies."
  -
    name: 'Helpdesk - Team'
    description: "\nManage helpdesk support teams."
  -
    name: 'Helpdesk - Ticket'
    description: "\nCreate and manage helpdesk support tickets."
  -
    name: 'Inventory - AI'
    description: "\nAI-powered inventory forecasting and reorder suggestions."
  -
    name: 'Inventory - Category'
    description: "\nManage product categories."
  -
    name: 'Inventory - Products'
    description: "\nManage inventory products including stock levels, pricing and categorisation."
  -
    name: 'Inventory - StockMovement'
    description: "\nRecord and query stock movements (in/out/transfers)."
  -
    name: 'Inventory - Unit'
    description: "\nManage units of measure."
  -
    name: 'Inventory - Warehouse'
    description: "\nManage warehouses and storage locations."
  -
    name: 'Manufacturing - AI'
    description: "\nAI-powered production planning and optimisation."
  -
    name: 'Manufacturing - Bom'
    description: "\nManage Bills of Materials (BOM)."
  -
    name: 'Manufacturing - ProductionOrder'
    description: "\nCreate and track manufacturing production orders."
  -
    name: 'Manufacturing - Workcenter'
