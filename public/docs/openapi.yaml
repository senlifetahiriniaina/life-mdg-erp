    url: 'http://localhost'
tags:
  -
    name: 'Accounting - AI'
    description: "\nAI-powered accounting analysis and suggestions."
  -
    name: 'Accounting - ChartOfAccount'
    description: "\nManage the chart of accounts (general ledger structure)."
  -
    name: 'Accounting - Invoices'
    description: "\nManage accounting invoices, bills, credit notes and debit notes."
  -
    name: 'Accounting - Journal'
    description: "\nManage accounting journals and journal entries."
  -
    name: 'BI - BiAI'
