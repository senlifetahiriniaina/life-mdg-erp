  -
    name: 'WhatsApp - WaTemplate'
    description: "\nManage approved WhatsApp message templates (HSM)."
  -
    name: 'WhatsApp - Webhook'
    description: "\nMeta webhook verification and inbound message handler."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
