  /api/v1/accounting/invoices:
    get:
      summary: 'List invoices.'
      operationId: listInvoices
      description: ''
      parameters:
        -
          in: query
          name: type
          description: 'Filter by type (invoice, bill, credit_note, debit_note).'
          example: invoice
          required: false
          schema:
            type: string
            description: 'Filter by type (invoice, bill, credit_note, debit_note).'
            example: invoice
        -
          in: query
          name: status
          description: 'Filter by status (draft, sent, paid, overdue, cancelled).'
          example: draft
          required: false
          schema:
            type: string
            description: 'Filter by status (draft, sent, paid, overdue, cancelled).'
            example: draft
        -
          in: query
          name: search
          description: 'Search by invoice number or partner name.'
          example: INV-2025
          required: false
          schema:
            type: string
            description: 'Search by invoice number or partner name.'
            example: INV-2025
        -
          in: query
          name: from
          description: 'date Filter by invoice date from (Y-m-d).'
          example: '2025-01-01'
          required: false
          schema:
            type: string
            description: 'date Filter by invoice date from (Y-m-d).'
            example: '2025-01-01'
        -
          in: query
          name: to
          description: 'date Filter by invoice date to (Y-m-d).'
          example: '2025-12-31'
          required: false
          schema:
            type: string
            description: 'date Filter by invoice date to (Y-m-d).'
            example: '2025-12-31'
        -
          in: query
          name: per_page
          description: 'Results per page (max 100).'
          example: 25
          required: false
          schema:
            type: integer
            description: 'Results per page (max 100).'
            example: 25
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - 'Accounting - Invoices'
    post:
      summary: ''
      operationId: postApiV1AccountingInvoices
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Accounting - Invoices'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: ''
                  example: credit_note
                  enum:
                    - invoice
                    - bill
                    - credit_note
                    - debit_note
                journal_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the acc_journals table.'
                  example: architecto
                number:
                  type: string
                  description: ''
                  example: architecto
                partner_id:
                  type: integer
                  description: ''
                  example: 16
                  nullable: true
                partner_name:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                partner_type:
                  type: string
                  description: ''
                  example: customer
                  enum:
                    - customer
                    - vendor
                  nullable: true
                invoice_date:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-05-02T18:43:46'
                due_date:
                  type: string
                  description: 'Must be a valid date. Must be a date after or equal to <code>invoice_date</code>.'
                  example: '2052-05-25'
                  nullable: true
                currency:
                  type: string
                  description: 'Must be 3 characters.'
                  example: ngz
                  nullable: true
                notes:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                lines:
                  type: array
                  description: 'Must have at least 1 items.'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      account_id:
                        type: string
                        description: 'The <code>id</code> of an existing record in the acc_chart_of_accounts table.'
                        example: null
                        nullable: true
                      product_id:
                        type: string
                        description: 'The <code>id</code> of an existing record in the inventory_products table.'
                        example: null
                        nullable: true
                      description:
                        type: string
                        description: ''
                        example: 'Eius et animi quos velit et.'
                      quantity:
                        type: number
                        description: 'Must be at least 0.'
                        example: 60
                      unit_price:
                        type: number
                        description: 'Must be at least 0.'
                        example: 42
                      tax_rate:
                        type: number
                        description: 'Must be at least 0. Must not be greater than 100.'
                        example: 5
                        nullable: true
                    required:
                      - description
                      - quantity
                      - unit_price
              required:
                - type
                - journal_id
                - number
                - invoice_date
                - lines
