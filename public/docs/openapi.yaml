      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: b
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                type:
                  type: string
                  description: ''
                  example: liability
                  enum:
                    - asset
                    - liability
                    - equity
                    - revenue
                    - expense
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                parent_id:
                  type: string
                  description: 'The <code>id</code> of an existing record in the acc_chart_of_accounts table.'
                  example: null
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: true
                  nullable: true
              required:
                - code
                - name
                - type
