name: Docker Build

on:
  push:
    branches: [ main, "claude/**" ]
    paths: [ 'Dockerfile', 'infra/**', 'composer.json', 'composer.lock', 'package.json', '.dockerignore', '.github/workflows/docker-build.yml' ]
  pull_request:
    paths: [ 'Dockerfile', 'infra/**', 'composer.json', 'composer.lock', 'package.json' ]
  workflow_dispatch:

jobs:
  build-image:
    name: Build life-mdg-erp image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: life-mdg-erp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
