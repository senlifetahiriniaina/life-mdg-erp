name: Deploy - Production Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: https://${{ secrets.DEPLOY_HOST }}

    steps:
      # docker-compose.prod.yml + Caddyfile must already exist on the target
      # server from a prior `git clone` + `scripts/deploy.sh` run (see
      # docs/07-DEPLOIEMENT/GUIDE-DEPLOIEMENT-SIMPLE.md) — this job re-pulls
      # the freshly-built image and restarts the stack against the server's
      # own .env, it does not provision a server from scratch.
      - name: Deploy via SSH (docker compose pull + up)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' IMAGE_REF='$IMAGE_REF' DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'
            set -e
            cd "$DEPLOY_PATH"

            git pull --ff-only
            docker pull "$IMAGE_REF"
            docker tag "$IMAGE_REF" "life-mdg-erp:$IMAGE_TAG"
            IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.prod.yml up -d --no-build
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan cache:clear
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:clear
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:clear

            # Garde le tag précédent taggé "previous" pour le rollback ci-dessous.
            docker tag "life-mdg-erp:$IMAGE_TAG" life-mdg-erp:previous 2>/dev/null || true
          EOF

      - name: Health Check
        run: |
          curl -f https://${{ secrets.DEPLOY_HOST }}/api/health || exit 1

      - name: Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": "Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment ${{ job.status }}*\nEnvironment: ${{ inputs.environment || 'production' }}\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  post-deploy-tests:
    name: Post-Deployment Tests
    needs: deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v7

      - name: Wait for Deployment
        run: sleep 30

      - name: API Health Check
        run: |
          curl -f https://${{ secrets.DEPLOY_HOST }}/api/health

      - name: Smoke Tests
        env:
          BASE_URL: https://${{ secrets.DEPLOY_HOST }}
          API_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: |
          npm install axios
          node scripts/smoke-tests.js

      - name: Performance Baseline
        run: |
          curl -s https://${{ secrets.DEPLOY_HOST }}/api/metrics > metrics-post.json
          echo "Deployment metrics captured"

  rollback:
    name: Rollback on Failure
    needs: post-deploy-tests
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Rollback Deployment
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" << 'EOF'
            set -e
            cd "$DEPLOY_PATH"

            # "previous" a été taggé par le job deploy juste avant de basculer
            # sur la nouvelle image — on repointe simplement dessus.
            IMAGE_TAG=previous docker compose -f docker-compose.prod.yml up -d --no-build
          EOF

      - name: Notify Rollback
        uses: slackapi/slack-github-action@v4
        with:
          payload: |
            {
              "text": "🚨 Deployment Rolled Back",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚨 Deployment Rolled Back*\nEnvironment: ${{ inputs.environment || 'production' }}\nCommit: ${{ github.sha }}\nPlease investigate the failure"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
