name: Supply Chain Security

# Informationnel uniquement — tous les jobs sont continue-on-error: true
# Ces checks ne bloquent pas les PRs mais informent l'équipe.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  trivy-scan:
    name: Trivy CVE Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          skip-dirs: node_modules,.git,storage/logs,vendor
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 30

  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
        continue-on-error: true

      - name: Install Composer (no-dev)
        continue-on-error: true
        run: composer install --no-scripts --no-progress --prefer-dist --no-dev

      - name: Generate PHP SBOM
        continue-on-error: true
        run: |
          composer require --dev cyclonedx/cyclonedx-php-composer --no-scripts --quiet || true
          composer make-bom --output-format JSON --output-file sbom-php.cdx.json || true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
        continue-on-error: true

      - name: Generate Node SBOM (frontend)
        continue-on-error: true
        run: |
          npm install --ignore-scripts 2>/dev/null || true
          npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom-frontend.cdx.json || true

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: sbom-${{ github.sha }}
          path: sbom-*.cdx.json
          retention-days: 90

  secret-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: critical
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always
        continue-on-error: true
