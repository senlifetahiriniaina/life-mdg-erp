name: Mobile App Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Expo CLI
        run: npm install -g eas-cli

      - name: Install Mobile Dependencies
        run: cd apps/mobile && npm ci

      - name: Configure EAS
        run: |
          mkdir -p ~/.eas
          echo "${{ secrets.EAS_TOKEN }}" > ~/.eas/credentials

      - name: Build APK
        working-directory: mobile
        run: |
          eas build \
            --platform android \
            --build-type apk \
            --non-interactive \
            --wait

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: '**/*.apk'
          retention-days: 30

      - name: Upload to Firebase App Distribution (Staging)
        if: inputs.build_type == 'staging'
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute *.apk \
            --app=${{ secrets.FIREBASE_APP_ID_ANDROID }} \
            --release-notes="Staging build for testing"

  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Expo CLI
        run: npm install -g eas-cli

      - name: Install Mobile Dependencies
        run: cd apps/mobile && npm ci

      - name: Setup Apple Credentials
        run: |
          mkdir -p ~/.eas
          echo "${{ secrets.EAS_TOKEN }}" > ~/.eas/credentials

      - name: Build IPA
        working-directory: mobile
        run: |
          eas build \
            --platform ios \
            --non-interactive \
            --wait

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: '**/*.ipa'
          retention-days: 30

      - name: Upload to TestFlight (Staging)
        if: inputs.build_type == 'staging'
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          npm install -g app-store-connect-cli
          # Upload to TestFlight for testing

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8

      - name: Extract Version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android-apk/**/*.apk
            ios-ipa/**/*.ipa
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') }}
          body: |
            # WideHalo ERP Mobile ${{ steps.version.outputs.VERSION }}

            ## Changes
            See the full changelog: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md

            ## Download
            - Android: `widehalo-${{ steps.version.outputs.VERSION }}.apk`
            - iOS: `widehalo-${{ steps.version.outputs.VERSION }}.ipa`

            ## Installation
            - **Android**: Install APK directly or download from Google Play Store
            - **iOS**: Download from App Store or use TestFlight for beta releases

  app-store-submit:
    name: Submit to App Stores
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'beta')

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: cd apps/mobile && npm ci

      - name: Submit to Google Play
        env:
          GOOGLE_PLAY_KEY_FILE: ${{ secrets.GOOGLE_PLAY_KEY_FILE }}
          GOOGLE_PLAY_PACKAGE_NAME: com.widehalo.erp
        run: |
          npm install -g @google-play-service/cli
          # Submit APK to Google Play Store

      - name: Submit to Apple App Store
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_BUNDLE_ID: com.widehalo.erp
        run: |
          npm install -g app-store-connect-cli
          # Submit IPA to Apple App Store

      - name: Notify Team
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ Mobile app submitted to stores",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Mobile App Released*\nVersion: ${{ github.ref_name }}\nAndroid & iOS builds submitted to app stores"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
