name: Performance Budget Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance-budget:
    name: Check Performance Budgets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || '' }}

      - name: Check JavaScript bundle size
        run: |
          echo "📦 JavaScript Bundle Size Analysis"
          echo "=================================================="

          VENDOR_BUNDLE=$(find public/build -name 'vendor-core-*.js' -type f 2>/dev/null | head -1)
          INDEX_BUNDLE=$(find public/build -name 'app-*.js' -type f 2>/dev/null | head -1)
          BUNDLE_FILE=${VENDOR_BUNDLE:-$INDEX_BUNDLE}

          if [ -z "$BUNDLE_FILE" ]; then
            echo "⚠️  Could not find main bundle file, skipping size check"
            exit 0
          fi

          SIZE_BYTES=$(stat -f%z "$BUNDLE_FILE" 2>/dev/null || stat -c%s "$BUNDLE_FILE" 2>/dev/null)
          SIZE_KB=$(awk -v b="$SIZE_BYTES" 'BEGIN {printf "%.2f", b / 1024}')
          BUDGET=819200

          echo "Bundle: $BUNDLE_FILE — ${SIZE_KB} KB (budget: 800 KB)"
          if [ $SIZE_BYTES -gt $BUDGET ]; then
            echo "⚠️  Bundle exceeds budget by $(awk -v s="$SIZE_BYTES" -v b="$BUDGET" 'BEGIN {printf "%.2f", (s-b)/1024}') KB"
          else
            echo "✅ Bundle within budget"
          fi

      - name: Performance budget summary
        if: always()
        run: echo "✅ Performance check complete"

  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: npm run build || true

      - name: Run Lighthouse CI
        continue-on-error: true
        run: |
          npm install -g @lhci/cli@0.10.x
          npm run dev > /tmp/dev.log 2>&1 &
          DEV_PID=$!
          timeout 30 bash -c "until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 0.5; done" || { kill $DEV_PID 2>/dev/null; echo "Server timeout"; exit 0; }
          if [ -f lighthouserc.json ]; then
            BASE_URL=http://localhost:5173 lhci autorun --config=lighthouserc.json || true
          fi
          kill $DEV_PID 2>/dev/null || true

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Audit
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          npm audit --audit-level=moderate || true

  comment-pr:
    name: Comment PR with Results
    runs-on: ubuntu-latest
    needs: [performance-budget]
    if: github.event_name == 'pull_request' && always()
    continue-on-error: true
    permissions:
      pull-requests: write

    steps:
      - name: Post summary
        run: |
          echo "Performance budget check completed."
          echo "Performance-budget result: ${{ needs.performance-budget.result }}"
