name: CI — Life MDG ERP

# ───────────────────────────────────────────────────────────────────────────
# Dépôt autonome, structure Laravel standard : composer.json/package.json à la
# racine, backend dans app/+Modules/*, frontend dans resources/js/ (pas de
# dossier webapp/ séparé, pas de split multi-dépôt comme WideHalo ERP).
# ───────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

concurrency:
  # Inclut le nom de l'event pour que le run push et le run pull_request d'une
  # même ref ne partagent pas de groupe et ne s'annulent pas mutuellement
  # (l'annulation prime sur continue-on-error au niveau job).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'

jobs:
  # ── 1. PHP Tests (informationnel, non-bloquant) ─────────────────────────────
  php-tests:
    name: PHP Tests & Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.4.5
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: life_mdg_test
        options: >
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot --silent"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10
        ports:
          - 3306:3306
      redis:
        image: redis:7.4-alpine
        options: >
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: redis, mbstring, pdo, pdo_mysql, bcmath
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}

      - name: Wait for MySQL
        run: timeout 90 bash -c 'until mysqladmin ping -h 127.0.0.1 -u root -proot --silent 2>/dev/null; do sleep 2; done'

      - name: Install Composer Dependencies
        run: composer install --no-scripts --no-progress --prefer-dist || true

      - name: Create .env for Testing
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing || true

      - name: Discover Packages
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
        run: php artisan package:discover --ansi || true

      - name: Run Database Migrations
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_DATABASE: life_mdg_test
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
        run: php artisan migrate --no-interaction || true

      - name: Run PHP Tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_DATABASE: life_mdg_test
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
        run: vendor/bin/pest --no-coverage || true

      - name: Run Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress || true

      - name: Run Code Style Check (Pint)
        run: vendor/bin/pint --test || true

  # ── 2. Frontend Build (informationnel) ──────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Type Check
        continue-on-error: true
        run: npm run type-check

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Build for Production
        run: npm run build

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: public/build/
          retention-days: 7

  # ── 3. Security Scan (informationnel) ───────────────────────────────────────
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_mysql

      - name: Install Composer Dependencies
        run: composer install --no-scripts --no-progress --prefer-dist || true

      - name: Audit Composer Dependencies
        run: composer audit || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit NPM Dependencies
        run: npm ci --legacy-peer-deps && npm audit --audit-level=high || true

  # ── 4. Build Status (toujours vert — informationnel uniquement) ─────────────
  build-status:
    name: Build Status
    needs: [php-tests, frontend-build, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    # Gate informationnel uniquement — ne fait jamais échouer le run (même
    # pattern que Supply Chain & Performance Budget, dont les runs concluent
    # toujours en succès).
    continue-on-error: true

    steps:
      - name: Report Results
        run: |
          echo "================================================"
          echo " Life MDG ERP — CI Status Summary"
          echo "================================================"
          echo ""
          echo "PHP Tests:       ${{ needs.php-tests.result }}"
          echo "Frontend Build:  ${{ needs.frontend-build.result }}"
          echo "Security Scan:   ${{ needs.security-scan.result }}"
          echo "================================================"
          echo "✅ CI report complete (tous les checks sont informationnels)"
